# ============================================================================
# ThreeC 1.0 —— GitHub Pages deployment
#
# 唯一目标：把已通过 Research / Product / Trust / Quality / Real Usage 的 ThreeC
# 变成一个**可稳定访问、可重复构建、可追溯、可回滚**的静态产品。
#
# 设计约束（不得违反）
#   - production deployment **必须**建立在 `npm test` + `build` 成功之上
#   - ★ **Research 只读门禁**（2026-10-13 新增）：`validate_db` /
#     `validate_timeline_export` / `validate_market_snapshot` /
#     `validate_historical_research_intake --check` / `refresh_downstream --check`
#     任一失败 → **不得部署**。理由：Product 消费 Research 产物，
#     而跨层不一致（DB↔export / 产品↔SA 版本 / 快照回指）**不一定**被某个 Product 测试覆盖。
#   - ★ **行情库先行恢复**（2026-10-16 新增）：行情三表已拆到不入库的 `market_data.db`，
#     Research 门禁跑之前必须由被跟踪的便携快照恢复它（失败即 workflow 失败）。
#   - 不允许跳过 `npm test`；不允许直接上传未构建源码
#   - **不提交** `dist/`（走 artifact 上传，见 .gitignore）
#   - permissions 最小化：仅 `contents: read` + `pages: write` + `id-token: write`
#   - 不引入任何第三方托管 / 后端 / 数据库 / runtime API
#   - 同一 concurrency group，避免并发部署互相覆盖
#
# 溯源（Gate D7）：`npm run build` 经 `vite.config.ts` 注入 package version /
# git commit / build time；Research artifact 版本（export source_commit、SA、TO）
# 由 Product 在构建期静态 import 汇总，页面页脚「Build Provenance」可查。
# 本 workflow 的 `Write build provenance summary` 步骤把它落到 Actions Summary，
# 使**每次部署**都能对账「哪个 commit 部署了哪个 Research 版本」。
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页手动重跑（回滚 rehearsal / 重新部署同一 commit 时使用）
  workflow_dispatch:

# 最小权限：GITHUB_TOKEN 只用于 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署；不取消进行中的部署，避免半成品上线
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Job 1 — 验证 + 构建
  # --------------------------------------------------------------------------
  build:
    name: Verify & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Type check (tsc -b)
        run: npx tsc -b

      # ★ 强制门禁：测试不通过则整个 workflow 失败，不会部署
      - name: Unit & integration tests (npm test)
        run: npm test

      # ----------------------------------------------------------------------
      # ★★ Research 只读门禁（2026-10-13 接入）
      #
      # 为什么：Product 消费的是**Research 产物**（export / SA / 快照 / lifecycle）。
      # 此前 CI **只**跑 Product 测试 —— 若 Research 侧出现「DB 与 export 不同步」
      # 「产品引用了旧 SA 版本」「快照回指悬空」等，Product 测试**可能仍然全绿**
      # （因为那些不一致不一定被某个测试覆盖）→ **不合格产物会被部署**。
      #
      # 这些检查全部是**只读**（不改任何文件）、**无网络**、总耗时 < 10s（实测）。
      # 任一失败 → workflow 失败 → **不会部署**。
      # ----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: pip install -r research/scripts/requirements.txt

      # ----------------------------------------------------------------------
      # ★★ 行情数据库恢复（2026-10-16 拆分）
      #
      # 背景：`market_daily`（373k 行）/ `market_series` / `trading_calendar` 已从
      #   `cycle_research.db`（曾 66 MB）拆到**不入库**的 `market_data.db`，
      #   否则 GitHub 单文件 50 MB 阈值会被持续突破。
      #
      # 干净克隆**无网络**也可恢复：输入是**被 Git 跟踪的便携快照**
      #   `research/data/market/snapshot/`（按年分片 `*.csv.gz` + `MANIFEST.json`，
      #   约 6.1 MiB = 原库 9.2%）。
      #
      # ★ 铁律：恢复失败 → 非零退出 → workflow 失败。
      #   **不得**跳过行情依赖检查，**不得**关闭 Research 门禁。
      #   `--check` 在 `--apply` 之后再跑一遍，确认「快照 ↔ 已恢复库」一致。
      # ----------------------------------------------------------------------
      - name: Restore market data DB (from versioned snapshot)
        run: |
          set -euo pipefail
          echo "::group::restore_market_data --apply"
          python research/scripts/restore_market_data.py --apply
          echo "::endgroup::"
          echo "::group::restore_market_data --check"
          python research/scripts/restore_market_data.py --check
          echo "::endgroup::"

      # ----------------------------------------------------------------------
      # ★★ 题材行情一致性（v0.24 接入）
      #
      # 为什么：历史题材地图的 `market_performance` 曾是**逐份手写**，与 `market_data.db`
      #   之间没有任何自动对账。v0.23 补齐大基金三期 4 只标的行情后，地图**仍停在
      #   「行情不可得」的旧静态 JSON** —— 数据库变了、产物没变，而所有 Product 测试仍然全绿。
      #
      # 这一条把「产物 ↔ 行情库」对起来（唯一入口 `theme_market_performance_v1`）：
      #   · `--check` **只读**：不写任何文件、不重签版本化产物（CI 不得自行签发产物）；
      #   · 任一活跃题材文件的数值 / 缺失状态 / AUTO 缺口行与库内实况不符 → 非零退出 → **不部署**；
      #   · 「行情库不覆盖该窗口」的旧数值标 UNVERIFIABLE（WARN），**不**当失败、也**不**改数。
      #
      # 前置：必须在 `restore_market_data --apply` **之后**运行（本步骤即在其后）。
      # ----------------------------------------------------------------------
      - name: Theme market performance consistency (--check)
        run: |
          set -euo pipefail
          echo "::group::build_theme_market_performance --check"
          python research/scripts/build_theme_market_performance.py --check
          echo "::endgroup::"
          echo "::group::theme market performance contract tests"
          python research/scripts/test_build_theme_market_performance.py
          echo "::endgroup::"

      # ----------------------------------------------------------------------
      # ★★ v0.28：参与者证据维度（同期表现 / 机制关系 / 对象登记）一致性门禁
      #
      # 为什么放在 CI：这三条轴是**产品文案的依据**，一旦产物与题材文档漂移，
      # 页面就会用旧维度解释新数据（v0.25 的 AUTO 措辞漂移就是这么漏出去的）。
      # `--check` 只读：重新推导并与已发布产物逐字段比对。
      # ----------------------------------------------------------------------
      - name: Participant evidence consistency (--check)
        run: |
          set -euo pipefail
          echo "::group::build_participant_evidence --check"
          python research/scripts/build_participant_evidence_v0_1.py --check
          echo "::endgroup::"
          echo "::group::participant evidence invariants"
          python research/scripts/test_build_participant_evidence.py
          echo "::endgroup::"

      # ----------------------------------------------------------------------
      # ★★ v0.29：历史市场角色（Point-in-Time）一致性 + PIT 纪律门禁
      #   `--check` 重算角色并与产物比对；不变量测试覆盖「事后集合不得 pit_safe」
      #   「识别日不得晚于窗口末仍标 pit_safe」「报道称龙头必须有原文措辞」。
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # ★★ v0.31：盘面涨停识别方法的**可验证性审计**（raw/adjusted 双口径 + 除权日处理）
      #   产物 limit_up_audit_v0_2.json 是角色层「计算基础 / 限制 / 置信度」的依据。
      #   ★ v0.32：`--check` 同时校验「审的是最新角色产物」与「ST 规则说明与脚本一致」，
      #     并由 test_audit_market_limit_up.py 锁板块 × 时期的 ST 涨跌幅规则。
      # ----------------------------------------------------------------------
      - name: Market limit-up method audit (--check)
        run: |
          set -euo pipefail
          echo "::group::audit_market_limit_up"
          python research/scripts/audit_market_limit_up_v0_1.py --check
          echo "::endgroup::"
          echo "::group::ST rule invariants"
          python research/scripts/test_audit_market_limit_up.py
          echo "::endgroup::"

      # ★★ v0.32：PIT **全路径**封口 —— legacy CSV 的 market_breadth 记录不再豁免；
      #   `--check` 跑统一 PIT 合同（截止日 / 逐条证据日期 / 事后字段 / 泄漏检查）。
      - name: Historical market roles (--check + PIT invariants)
        run: |
          set -euo pipefail
          echo "::group::build_historical_market_roles --check"
          python research/scripts/build_historical_market_roles_v0_1.py --check
          echo "::endgroup::"
          echo "::group::market roles PIT invariants"
          python research/scripts/test_build_historical_market_roles.py
          echo "::endgroup::"

      # ★★ v0.33 / v0.35：当前前瞻观察 + 季节性发现（**不联网**，只校验最新产物）
      # ★ v0.40：季节性改用 v0_3 校验器（protocol / pit_eligible_years / bias_audit / walk_forward_audit）。
      # ★ v0.41：改用 v0_4 —— 额外校验 as_of == 基准最后交易日、criteria 与脚本常量一致、
      #   oos_summary 两层统计齐备、重算当前窗口（无库时显式 SKIP 源数据核对）。
      # ★ v0.42：改用 v0_5 —— 补 exploratory.min_hit_rate、四类结构检查、两层加总对账、
      #   scan_audit 互斥分组自洽；并加前端摘要一致性 + 校验器不变量测试（同一 Job）。
      - name: Forward observation + seasonal discovery (--check)
        run: |
          set -euo pipefail
          python research/scripts/build_forward_observation_v0_1.py --check
          python research/scripts/discover_seasonal_patterns_v0_5.py --check
          python research/scripts/build_pattern_summary_v0_1.py --check
          python research/scripts/test_discover_seasonal_patterns_v0_5.py

          # ★ v0.51：候选形成日志（追加式）+ 滚动结算账本。
          #   `--check` = 形成稳定性（F1–F6，**不需要**行情库）+ 结算一致性（S1–S5，需要）。
          #   CI 无 `history_scan.db` → 结算部分**显式 SKIP**，但**形成稳定性照常校验**，
          #   不会被静默跳过；有库时（本地）才重算结算数字。
          echo "::group::build_candidate_ledger_v0_2 --check"
          python research/scripts/build_candidate_ledger_v0_2.py --check
          echo "::endgroup::"
          python research/scripts/test_candidate_ledger_v0_2.py

          # ★ v0.66：自动发现的新题材线索（公开政策事件 → 板块关联 → 行情核验）。
          #   校验结构 / 来源 URL / 关联依据 / 状态机自洽 / 去重；行情复算在 CI 里**显式 SKIP**
          #   （无 1.3GB history_scan.db），不会被静默通过。
          echo "::group::build_new_theme_radar_v0_1 --check"
          python research/scripts/build_new_theme_radar_v0_1.py --check
          echo "::endgroup::"

      - name: Research read-only gates
        run: |
          set -euo pipefail
          echo "::group::validate_db"
          python research/scripts/validate_db.py
          echo "::endgroup::"
          echo "::group::validate_timeline_export"
          python research/scripts/validate_timeline_export.py
          echo "::endgroup::"

          echo "::group::validate_market_snapshot"
          python research/current/market_snapshots/scripts/validate_market_snapshot_v0_1.py
          echo "::endgroup::"

          echo "::group::validate_historical_research_intake (infrastructure)"
          python research/scripts/validate_historical_research_intake.py --check
          echo "::endgroup::"

          # ★ 这条最关键：C0–C10 覆盖「DB↔export 同步」「产品引用最新 SA」
          #   「快照回指」「themeColors↔根主题」「lifecycle 覆盖」等**跨层一致性**。
          echo "::group::refresh_downstream --check (C0–C10)"
          python research/scripts/refresh_downstream.py --check
          echo "::endgroup::"

      # GITHUB_ACTIONS 由 GitHub 内置，vite.config.ts 据此取 base = /Cycle/
      - name: Build (base = /Cycle/)
        run: npm run build
      - name: Verify base path is /Cycle/
        run: |
          set -euo pipefail
          echo "--- dist/index.html asset refs ---"
          grep -oE '(src|href)="[^"]*"' dist/index.html
          # 硬门禁：产物中不得出现以 /assets/ 开头的绝对引用（Pages 子路径下会 404）
          if grep -qE '(src|href)="/assets/' dist/index.html; then
            echo "::error::base path 未生效：dist/index.html 仍含 /assets/ 绝对引用"
            exit 1
          fi
          if ! grep -qE '(src|href)="/Cycle/assets/' dist/index.html; then
            echo "::error::base path 错误：未发现 /Cycle/assets/ 引用"
            exit 1
          fi
          echo "OK: base path = /Cycle/"

      - name: Write build provenance summary
        run: |
          set -euo pipefail

          # ---- ★ SA artifact 版本解析（规则抽到可测试脚本里）----
          #   历史教训（2026-10-13）：此处曾写死 `…_v0_5.json`，而产品早已消费 `…_v0_13.json`
          #   → 部署摘要**报错误的版本号**，而 v0_5 文件仍在，所以**不报错、只静默失真**。
          #
          #   ★ 规则（见 `scripts/resolve_sa_artifact.py` 的模块 docstring，可独立单测）：
          #     ① **权威来源 = 产品实际消费**（`src/data/buildProvenance.ts` 的静态 import），不是推断
          #     ② 最新 = 按 **(minor, patch) 数值**比较取最大 —— ★ **不是**字典序
          #        （字典序会把 `v0_9` 排到 `v0_13` 之后），★ **不是** mtime
          #     ③ 两者必须一致，且权威来源指向的文件必须存在；否则**拒绝部署**
          echo "::group::SA artifact 版本解析"
          python scripts/resolve_sa_artifact.py
          echo "::endgroup::"

          SA_JSON=$(python scripts/resolve_sa_artifact.py --json)
          SA_FILE=$(printf '%s' "$SA_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["imported"])')

          {
            echo '## Deployment provenance'
            echo ''
            echo '| 字段 | 值 |'
            echo '|---|---|'
            echo "| Product version | \`$(node -p "require('./package.json').version")\` |"
            echo "| Workflow commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Research export source_commit | \`$(node -p "require('./exports/timeline_export_v1.json').source_commit")\` |"
            echo "| Research export version | \`$(node -p "require('./exports/timeline_export_v1.json').timeline_export_version")\` |"
            echo "| Research export generated_at | \`$(node -p "require('./exports/timeline_export_v1.json').generated_at")\` |"
            echo "| Historical objects | \`$(node -p "require('./exports/timeline_export_v1.json').campaigns.length")\` Campaign + \`$(node -p "require('./exports/timeline_export_v1.json').research_candidates.length")\` RC |"
            echo "| SA artifact | \`${SA_FILE}\` |"
            echo "| SA artifact_version | \`$(node -p "require('./research/research/reports/${SA_FILE}').artifact_version")\` |"
            echo "| SA rule_set_version | \`$(node -p "require('./research/research/reports/${SA_FILE}').rule_set_version")\` |"
            echo "| TO artifact_version | \`$(node -p "require('./research/research/reports/time_observation_patterns_v0_2.json').artifact_version")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上传构建产物；源码不会被部署
          path: dist

  # --------------------------------------------------------------------------
  # Job 2 — 部署到 GitHub Pages（依赖 build 成功）
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
